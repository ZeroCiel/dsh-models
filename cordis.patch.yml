- insert:
  - id: xh-local-bridge
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: xhlocal
      transport: stdio
      command: C:/Users/Administrator/.dsh/dsh-runtimes/dsh-primary-runtime/dependencies/python/python.exe
      args:
      - D:/Backup/Documents/deepseek-harness/default-workspace/xh-local-bridge/server.py
      - --stdio
      cwd: D:/Backup/Documents/deepseek-harness/default-workspace/xh-local-bridge
      failOnStartupError: false
- insert:
  - id: craft-anything
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: craft-anything
      transport: stdio
      command: C:/Users/Administrator/AppData/Local/Programs/CraftAnything/craft-anything-0.6.1-windows-x64-portable/craft-anything-cli.exe
      args:
      - mcp
      failOnStartupError: false
- insert:
  - id: magpie-mcp-magpie-artifacts
    name: '@deepseek-ai/dsh-mcp-client'
    config:
      serverName: magpie-artifacts
      transport: stdio
      command: C:\Users\Administrator\AppData\Local\Programs\magpie\magpie.exe
      args:
      - mcp
      - artifacts
